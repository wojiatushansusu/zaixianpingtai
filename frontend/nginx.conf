server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 不开 gzip 的话，1.3MB 的主包在弱网下很容易传到一半断掉（见 README「首屏」一节）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml;

    # 上传与视频证据可能较大
    client_max_body_size 20m;

    # WebSocket：必须先于 /api/ 匹配（nginx 取最长的前缀）
    location /api/ws/ {
        proxy_pass http://backend:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 生成试卷是同步长请求，超时要比后端自身设置的更长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # index.html 绝不缓存。
    # 它里面写着带哈希的 chunk 文件名：一旦被浏览器缓存，重新部署后旧 HTML 会去请求
    # 已不存在的旧 chunk → 404 → **整页白屏**（标题有、内容没有），且刷新也无法恢复。
    # try_files 回退到 /index.html 是内部重定向，同样会命中这里。
    location = /index.html {
        # expires off：否则 nginx 会再补一条 Cache-Control，与上面这条重复
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA 路由回退：刷新 /student/exams 之类的前端路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可以长期缓存：内容变了文件名就变
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
