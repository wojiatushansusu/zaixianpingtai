name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一个分支连续推送时，取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: 运行单测
        working-directory: backend
        # javacv-platform 默认会拉取所有平台的原生库（超过 1GB），
        # CI 只需要 linux-x86_64，指定后可显著缩短依赖下载时间。
        run: mvn -B -Djavacpp.platform=linux-x86_64 test

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端 · 单测与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 运行单元测试
        working-directory: frontend
        run: npm test

      - name: 构建
        working-directory: frontend
        run: npm run build

  compose:
    name: 编排 · compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml 里用了 ${VAR:?...} 强制必填，
      # 因此这里必须提供 dummy 值，否则会被"缺失变量"拦下——这正是预期行为。
      - name: 校验 docker-compose.yml
        run: docker compose config -q
        env:
          DB_PASSWORD: ci-dummy-password
          JWT_SECRET: ci-dummy-secret-at-least-32-bytes-long
