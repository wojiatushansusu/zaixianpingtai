# 一键启动：docker compose up -d --build
#
# 启动前把 .env.example 复制为 .env 并填好 DB_PASSWORD 与 JWT_SECRET，
# 缺这两项时后端会拒绝启动（这是刻意设计，不是故障）。
# 访问 http://localhost:8088

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请先在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: exam_platform
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表并写入演示数据
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: exam_platform
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?请先在 .env 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请先在 .env 中设置 JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      # Redis 服务名（容器内 localhost 指向自己，必须显式指定）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI：不填 AI_API_KEY 则功能保持关闭（出卷 / 讲解 / 补标全部不可用）
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_URL: ${AI_API_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions}
      AI_API_KEY: ${AI_API_KEY:-}
      TZ: Asia/Shanghai
    volumes:
      # 上传/视频证据需要持久化，否则容器重建即丢失
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  mysql-data:
  redis-data:
  uploads:
